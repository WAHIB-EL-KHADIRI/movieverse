[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/tmdb/* is served by netlify/functions/tmdb.mts (path-routed functions run before rewrites).

# Single-page app: serve index.html for client-side routes (/favorites, /movie/:id…)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers are generated from server/securityHeaders.ts into dist/_headers
# at build time (single source of truth, also applied by `vite preview`).
